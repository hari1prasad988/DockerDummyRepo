<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse — Book Your Show</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============ RESET ============ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #0a0a0f;
      --bg-2:        #12121c;
      --card:        #1a1a28;
      --card-hover:  #22223a;
      --line:        #2a2a44;
      --line-soft:   #1f1f33;
      --text:        #f5f5fa;
      --text-soft:   #a0a0b8;
      --text-mute:   #6a6a88;
      --accent:      #ff2d55;
      --accent-2:    #ff6b35;
      --gold:        #ffc857;
      --green:       #22c55e;
      --seat-free:   #2a2a44;
      --seat-taken:  #4a4a5e;
      --seat-sel:    #ff2d55;
      --seat-vip:    #ffc857;
      --seat-vip-sel:#f59e0b;
      --radius:      14px;
      --radius-lg:   24px;
      --ease:        cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 10% 0%, #1a0a2a 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, #2a0a1a 0%, transparent 40%);
      background-attachment: fixed;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    ::selection { background: var(--accent); color: #fff; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

    .wrap {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 clamp(1.25rem, 4vw, 2.5rem);
    }

    /* ============ HEADER ============ */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line-soft);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.1rem 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    .logo i { color: var(--accent); font-size: 1.5rem; }
    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex: 1;
      justify-content: center;
    }
    .nav a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-soft);
      letter-spacing: 0.02em;
      transition: color 0.25s var(--ease);
      position: relative;
    }
    .nav a::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.3s var(--ease);
    }
    .nav a:hover, .nav a.active { color: var(--text); }
    .nav a:hover::after, .nav a.active::after { transform: scaleX(1); }

    .header-tools { display: flex; align-items: center; gap: 0.5rem; }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .location-pill:hover { border-color: var(--accent); color: var(--text); }
    .location-pill i { color: var(--accent); font-size: 0.75rem; }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text-soft);
      font-size: 0.95rem;
      transition: all 0.25s var(--ease);
      position: relative;
    }
    .icon-btn:hover { background: var(--card); color: var(--accent); }
    .icon-btn .dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid var(--bg);
    }

    /* ============ HERO BANNER ============ */
    .hero {
      position: relative;
      margin: 2rem 0 3.5rem;
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 480px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      filter: brightness(0.4);
      transform: scale(1.05);
      transition: transform 8s var(--ease);
    }
    .hero:hover .hero-bg { transform: scale(1.12); }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 45%, rgba(10,10,15,0.2) 100%),
        linear-gradient(0deg, rgba(10,10,15,0.9) 0%, transparent 60%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: clamp(2rem, 5vw, 4rem);
      max-width: 620px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #fff;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
    }
    .hero h1 em { color: var(--accent); font-style: normal; }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      font-size: 0.85rem;
      color: var(--text-soft);
    }
    .hero-meta .rating {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--gold);
      font-weight: 600;
    }
    .hero-meta .dot-sep {
      width: 4px; height: 4px;
      background: var(--text-mute);
      border-radius: 50%;
    }

    .hero-desc {
      color: var(--text-soft);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      max-width: 480px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1.8rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: all 0.3s var(--ease);
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #ff4d70;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -10px rgba(255, 45, 85, 0.6);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      backdrop-filter: blur(10px);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* ============ SECTION ============ */
    .section { padding: 2rem 0; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .section-head h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
    }
    .section-head h2 i { color: var(--accent); font-size: 1.4rem; }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 0.5rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-soft);
      transition: all 0.25s var(--ease);
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--text); }
    .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ============ MOVIE GRID ============ */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .movie-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      transition: all 0.4s var(--ease);
      border: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
    }
    .movie-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 30px 50px -20px rgba(255, 45, 85, 0.3);
    }

    .movie-poster {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: var(--bg-2);
    }
    .movie-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease);
    }
    .movie-card:hover .movie-poster img { transform: scale(1.08); }

    .movie-poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(10,10,15,0.95) 0%, transparent 50%);
    }

    .movie-rating {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      z-index: 2;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(10px);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--gold);
    }

    .movie-badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 2;
      background: var(--accent);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
    }

    .movie-info {
      padding: 1rem 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .movie-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      transition: color 0.25s var(--ease);
    }
    .movie-card:hover .movie-title { color: var(--accent); }

    .movie-details {
      font-size: 0.75rem;
      color: var(--text-mute);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .movie-details .dot-sep {
      width: 3px; height: 3px;
      background: var(--text-mute);
      border-radius: 50%;
    }

    .movie-genres {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .genre-tag {
      font-size: 0.65rem;
      padding: 0.2rem 0.55rem;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text-soft);
    }

    /* ============ BOOKING PANEL ============ */
    .booking-section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 2.5rem);
      margin: 3rem 0;
    }

    .booking-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--line);
    }

    .booking-movie {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .booking-poster {
      width: 70px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .booking-meta h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.25rem;
    }
    .booking-meta p {
      font-size: 0.82rem;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .booking-meta p i { color: var(--accent); font-size: 0.75rem; }

    /* Showtime Selector */
    .showtimes {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .showtime-btn {
      padding: 0.7rem 1.3rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-soft);
      transition: all 0.25s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .showtime-btn small {
      font-size: 0.68rem;
      color: var(--text-mute);
      font-weight: 500;
    }
    .showtime-btn:hover { border-color: var(--accent); color: var(--text); }
    .showtime-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .showtime-btn.active small { color: rgba(255,255,255,0.75); }

    /* ============ SEAT MAP ============ */
    .seat-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .screen {
      position: relative;
      width: min(70%, 560px);
      height: 8px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 50%;
      margin-bottom: 0.7rem;
      box-shadow: 0 0 40px 8px rgba(255, 45, 85, 0.35);
    }
    .screen-label {
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin-bottom: 2.5rem;
    }

    .seat-rows {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 2rem;
    }

    .seat-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      justify-content: center;
    }

    .row-label {
      width: 22px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-mute);
      text-align: center;
    }

    .seat {
      width: 26px;
      height: 26px;
      border-radius: 6px 6px 3px 3px;
      background: var(--seat-free);
      cursor: pointer;
      transition: all 0.2s var(--ease);
      position: relative;
      border: 1.5px solid transparent;
    }
    .seat::after {
      content: '';
      position: absolute;
      left: 15%;
      right: 15%;
      bottom: -3px;
      height: 3px;
      background: inherit;
      border-radius: 0 0 3px 3px;
    }
    .seat:hover:not(.taken) {
      background: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 6px 12px -4px var(--accent);
    }
    .seat.vip {
      background: rgba(255, 200, 87, 0.25);
      border-color: var(--seat-vip);
    }
    .seat.vip:hover:not(.taken) {
      background: var(--seat-vip);
      box-shadow: 0 6px 12px -4px var(--seat-vip);
    }
    .seat.selected {
      background: var(--seat-sel) !important;
      border-color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 6px 14px -4px var(--seat-sel);
    }
    .seat.selected.vip {
      background: var(--seat-vip-sel) !important;
      box-shadow: 0 6px 14px -4px var(--seat-vip-sel);
    }
    .seat.taken {
      background: var(--seat-taken);
      cursor: not-allowed;
      opacity: 0.55;
    }
    .seat.taken::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.15) 45%, rgba(255,255,255,0.15) 55%, transparent 55%);
    }

    /* ============ LEGEND ============ */
    .legend {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 1.2rem;
      background: var(--bg-2);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      margin-bottom: 2rem;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-soft);
    }
    .legend-seat {
      width: 18px;
      height: 18px;
      border-radius: 4px 4px 2px 2px;
    }
    .legend-seat.free { background: var(--seat-free); }
    .legend-seat.vip { background: rgba(255, 200, 87, 0.4); border: 1.5px solid var(--seat-vip); }
    .legend-seat.selected { background: var(--seat-sel); }
    .legend-seat.taken { background: var(--seat-taken); opacity: 0.6; }

    /* ============ BOOKING SUMMARY ============ */
    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: center;
      padding: 1.5rem;
      background: var(--bg-2);
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }

    .summary-info {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
    }
    .summary-stat .label {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-mute);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .summary-stat .value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .summary-stat .value .price {
      color: var(--accent);
    }

    .selected-seats-display {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      min-height: 24px;
    }
    .selected-seat-chip {
      font-size: 0.7rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .summary-total {
      text-align: right;
    }
    .summary-total .label {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-mute);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .summary-total .amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      line-height: 1;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .btn-book {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 1rem 2.2rem;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: all 0.3s var(--ease);
      margin-top: 1rem;
      width: 100%;
      justify-content: center;
    }
    .btn-book:hover:not(:disabled) {
      background: #ff4d70;
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -10px rgba(255, 45, 85, 0.7);
    }
    .btn-book:disabled {
      background: var(--line);
      color: var(--text-mute);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* ============ COMING SOON ============ */
    .coming-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
    }

    .coming-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 16 / 10;
      cursor: pointer;
      border: 1px solid var(--line-soft);
      transition: all 0.4s var(--ease);
    }
    .coming-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 24px 40px -20px rgba(255, 45, 85, 0.4);
    }
    .coming-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease);
    }
    .coming-card:hover img { transform: scale(1.08); }
    .coming-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(10,10,15,0.95) 0%, transparent 65%);
    }
    .coming-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      z-index: 2;
    }
    .coming-date {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .coming-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.03em;
      line-height: 1.1;
    }

    /* ============ FOOTER ============ */
    .footer {
      margin-top: 5rem;
      padding: 3rem 0 2rem;
      border-top: 1px solid var(--line-soft);
      color: var(--text-mute);
      font-size: 0.82rem;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .footer-socials { display: flex; gap: 0.6rem; }
    .footer-socials a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text-soft);
      font-size: 0.85rem;
      transition: all 0.25s var(--ease);
    }
    .footer-socials a:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-3px);
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 20px 40px -12px rgba(255, 45, 85, 0.5);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast i { color: var(--accent); }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 10, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease);
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.4s var(--ease);
    }
    .modal-overlay.show .modal { transform: scale(1); }

    .modal-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem;
      font-size: 1.8rem;
      color: #fff;
      box-shadow: 0 16px 32px -10px rgba(255, 45, 85, 0.6);
    }
    .modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.6rem;
    }
    .modal p {
      color: var(--text-soft);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }
    .modal-details {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1.8rem;
      text-align: left;
      font-size: 0.85rem;
    }
    .modal-details .row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
    }
    .modal-details .row span:first-child { color: var(--text-mute); }
    .modal-details .row span:last-child { font-weight: 600; }
    .modal-details .row.total {
      border-top: 1px solid var(--line);
      margin-top: 0.5rem;
      padding-top: 0.8rem;
      font-size: 1rem;
    }
    .modal-details .row.total span:last-child { color: var(--accent); font-weight: 700; }

    .modal-close {
      background: var(--accent);
      color: #fff;
      padding: 0.9rem 2rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: all 0.25s var(--ease);
      width: 100%;
    }
    .modal-close:hover { background: #ff4d70; transform: translateY(-2px); }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 900px) {
      .nav { display: none; }

      .summary { grid-template-columns: 1fr; }
      .summary-total { text-align: left; }
      .summary-info { gap: 1.5rem; }
    }
