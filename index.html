<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse — Premium Movie Booking</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ============ RESET ============ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #07070d;
      --bg-2:       #0f0f1a;
      --bg-3:       #16162a;
      --card:       #15152b;
      --card-2:     #1c1c36;
      --line:       #26264a;
      --line-soft:  #1a1a30;
      --text:       #ffffff;
      --text-soft:  #b4b4d0;
      --text-mute:  #6e6e94;
      --accent:     #ff2965;
      --accent-2:   #ff6b35;
      --accent-glow: rgba(255, 41, 101, 0.4);
      --gold:       #ffc857;
      --green:      #10d97e;
      --vip:        #a855f7;
      --vip-2:      #c084fc;
      --seat-free:  #1e1e3f;
      --seat-hover: #3a3a6a;
      --seat-taken: #2a2a44;
      --radius-sm:  10px;
      --radius:     16px;
      --radius-lg:  24px;
      --radius-xl:  32px;
      --ease:       cubic-bezier(0.22, 1, 0.36, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(255, 41, 101, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 100%, rgba(168, 85, 247, 0.10) 0%, transparent 45%);
      background-attachment: fixed;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { display: block; max-width: 100%; }

    ::selection { background: var(--accent); color: #fff; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }

    /* ============ LAYOUT ============ */
    .wrap {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2.5rem);
    }

    /* ============ HEADER ============ */
    .header {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(7, 7, 13, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--line-soft);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.1rem 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.85rem;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 0 24px var(--accent-glow);
      position: relative;
    }
    .logo-mark::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      opacity: 0.35;
      filter: blur(8px);
      z-index: -1;
    }
    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex: 1;
      justify-content: center;
    }
    .nav a {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-soft);
      letter-spacing: 0.02em;
      transition: color 0.25s var(--ease);
      position: relative;
      padding: 0.3rem 0;
    }
    .nav a::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transform: scaleX(0);
      transform-origin: right center;
      transition: transform 0.4s var(--ease);
      border-radius: 2px;
    }
    .nav a:hover, .nav a.active { color: var(--text); }
    .nav a:hover::after, .nav a.active::after { transform: scaleX(1); transform-origin: left center; }

    .header-tools { display: flex; align-items: center; gap: 0.6rem; }

    .location-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .location-pill:hover {
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-1px);
    }
    .location-pill i { color: var(--accent); font-size: 0.72rem; }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text-soft);
      font-size: 0.95rem;
      transition: all 0.25s var(--ease);
      position: relative;
    }
    .icon-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -8px var(--accent-glow);
    }
    .icon-btn .dot {
      position: absolute;
      top: -3px; right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      background: var(--accent);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 999px;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg);
    }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      margin: 1.8rem 0 3rem;
      border-radius: var(--radius-xl);
      overflow: hidden;
      min-height: 520px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      filter: brightness(0.35) saturate(1.2);
      transform: scale(1.08);
      transition: transform 10s var(--ease);
      z-index: -2;
    }
    .hero:hover .hero-bg { transform: scale(1.15); }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(7,7,13,0.98) 0%, rgba(7,7,13,0.82) 40%, rgba(7,7,13,0.35) 75%, rgba(7,7,13,0.6) 100%),
        linear-gradient(0deg, rgba(7,7,13,0.95) 0%, transparent 55%);
      z-index: -1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: clamp(2rem, 5vw, 4.5rem);
      max-width: 660px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 1.3rem;
      box-shadow: 0 10px 24px -8px var(--accent-glow);
    }
    .hero-badge i { font-size: 0.7rem; }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 6.5vw, 5rem);
      line-height: 0.98;
      letter-spacing: 0.02em;
      margin-bottom: 1.1rem;
      text-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.3rem;
      font-size: 0.85rem;
      color: var(--text-soft);
    }
    .hero-meta .rating {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--gold);
      font-weight: 600;
    }
    .hero-meta .pill {
      padding: 0.25rem 0.7rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .hero-desc {
      color: var(--text-soft);
      font-size: 0.98rem;
      line-height: 1.75;
      margin-bottom: 2rem;
      max-width: 500px;
      font-weight: 300;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.95rem 1.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      transition: all 0.3s var(--ease);
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 12px 28px -10px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -12px var(--accent-glow);
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.6s var(--ease);
    }
    .btn-primary:hover::after { left: 100%; }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.18);
      color: #fff;
      backdrop-filter: blur(10px);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-3px);
    }

    /* ============ SECTION ============ */
    .section { padding: 2rem 0; }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .section-title {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .section-eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .section-head h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.7rem, 3.2vw, 2.4rem);
      letter-spacing: 0.03em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
    }
    .section-head h2 i { color: var(--accent); font-size: 1.3rem; }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 0.55rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-soft);
      transition: all 0.25s var(--ease);
      white-space: nowrap;
      background: var(--card);
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
    .filter-chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px -8px var(--accent-glow);
    }

    /* ============ MOVIE GRID ============ */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .movie-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--card);
      cursor: pointer;
      transition: all 0.5s var(--ease);
      border: 1px solid var(--line-soft);
      display: flex;
      flex-direction: column;
      transform: translateZ(0);
    }
    .movie-card:hover {
      transform: translateY(-10px);
      border-color: var(--accent);
      box-shadow:
        0 32px 60px -24px rgba(255, 41, 101, 0.4),
        0 0 0 1px var(--accent);
    }

    .movie-poster {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: var(--bg-2);
    }
    .movie-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s var(--ease);
    }
    .movie-card:hover .movie-poster img { transform: scale(1.1); }

    .movie-poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(7,7,13,0.98) 0%, transparent 55%);
      z-index: 1;
    }

    .movie-rating {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      z-index: 3;
      background: rgba(7, 7, 13, 0.85);
      backdrop-filter: blur(12px);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--gold);
      border: 1px solid rgba(255,200,87,0.25);
    }

    .movie-badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      z-index: 3;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      box-shadow: 0 6px 16px -4px var(--accent-glow);
    }

    .movie-hover-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      z-index: 2;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.4s var(--ease);
    }
    .movie-card:hover .movie-hover-overlay {
      transform: translateY(0);
      opacity: 1;
    }
    .movie-hover-overlay .book-now {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 10px 20px -6px var(--accent-glow);
    }

    .movie-info {
      padding: 1rem 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .movie-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
      transition: color 0.25s var(--ease);
      letter-spacing: -0.01em;
    }
    .movie-card:hover .movie-title { color: var(--accent); }

    .movie-details {
      font-size: 0.76rem;
      color: var(--text-mute);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .movie-details .dot-sep {
      width: 3px; height: 3px;
      background: var(--text-mute);
      border-radius: 50%;
    }

    .movie-genres {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }
    .genre-tag {
      font-size: 0.65rem;
      padding: 0.2rem 0.55rem;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text-soft);
      font-weight: 500;
    }

    /* ============ BOOKING PANEL ============ */
    .booking-section {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: clamp(1.5rem, 4vw, 2.75rem);
      margin: 3rem 0;
      position: relative;
      overflow: hidden;
    }
    .booking-section::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-glow), transparent 65%);
      pointer-events: none;
      opacity: 0.4;
    }

    .booking-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding-bottom: 1.8rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 2;
    }

    .booking-movie {
      display: flex;
      align-items: center;
      gap: 1.3rem;
    }

    .booking-poster {
      width: 82px;
      height: 116px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 24px -8px rgba(0,0,0,0.6);
    }

    .booking-meta h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 0.03em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .booking-meta p {
      font-size: 0.85rem;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .booking-meta p i { color: var(--accent); font-size: 0.75rem; }

    /* Showtimes */
    .showtimes-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-mute);
      font-weight: 600;
      margin-bottom: 0.9rem;
    }

    .showtimes {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 2;
    }
    .showtime-btn {
      padding: 0.75rem 1.4rem;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-soft);
      transition: all 0.25s var(--ease);
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.1rem;
      background: var(--card);
      min-width: 100px;
    }
    .showtime-btn small {
      font-size: 0.65rem;
      color: var(--text-mute);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .showtime-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-2px);
    }
    .showtime-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 10px 24px -8px var(--accent-glow);
    }
    .showtime-btn.active small { color: rgba(255,255,255,0.8); }

    /* ============ SEAT MAP ============ */
    .seat-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
    }

    .screen-wrap {
      width: min(75%, 620px);
      margin-bottom: 3rem;
      text-align: center;
      position: relative;
    }

    .screen-curve {
      height: 10px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), var(--accent), transparent);
      border-radius: 50%;
      box-shadow:
        0 0 30px 4px var(--accent-glow),
        0 6px 40px 8px rgba(255, 107, 53, 0.3);
      position: relative;
    }
    .screen-curve::before {
      content: '';
      position: absolute;
      left: 10%; right: 10%;
      top: 10px;
      height: 40px;
      background: linear-gradient(180deg, var(--accent-glow), transparent);
      border-radius: 50%;
      filter: blur(12px);
    }
    .screen-label {
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin-top: 1rem;
      font-weight: 600;
    }

    .seat-rows {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .seat-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
    }

    .row-label {
      width: 24px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-mute);
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
    }

    .seat {
      width: 28px;
      height: 28px;
      border-radius: 8px 8px 4px 4px;
      background: var(--seat-free);
      cursor: pointer;
      transition: all 0.2s var(--ease);
      position: relative;
      border: 1.5px solid transparent;
    }
    .seat::after {
      content: '';
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: -4px;
      height: 4px;
      background: inherit;
      border-radius: 0 0 4px 4px;
      border: inherit;
      border-top: none;
    }
    .seat:hover:not(.taken) {
      background: var(--accent);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 16px -4px var(--accent-glow);
      z-index: 2;
    }
    .seat.vip {
      background: linear-gradient(180deg, var(--vip-2), var(--vip));
      border-color: var(--vip-2);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }
    .seat.vip:hover:not(.taken) {
      background: var(--vip-2);
      box-shadow: 0 8px 20px -4px rgba(168, 85, 247, 0.7);
    }
    .seat.selected {
      background: linear-gradient(180deg, var(--accent), var(--accent-2)) !important;
      border-color: #fff;
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 20px -4px var(--accent-glow), 0 0 0 2px #fff;
      z-index: 2;
    }
    .seat.taken {
      background: var(--seat-taken);
      cursor: not-allowed;
      opacity: 0.45;
    }
    .seat.taken::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(45deg, transparent 44%, rgba(255,255,255,0.2) 44%, rgba(255,255,255,0.2) 56%, transparent 56%);
      border-radius: inherit;
    }

      flex-wrap: wrap;
      justify-content: center;
      padding: 1.3rem 1.8rem;
      background: var(--bg-2);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      margin-bottom: 2rem;
      position: relative;
      z-index: 2;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.8rem;
      color: var(--text-soft);
      font-weight: 500;
    }
    .legend-seat {
      width: 20px;
      height: 20px;
      border-radius: 6px 6px 3px 3px;
      position: relative;
    }
    .legend-seat.free { background: var(--seat-free); }
    .legend-seat.vip { background: linear-gradient(180deg, var(--vip-2), var(--vip)); }
    .legend-seat.selected { background: linear-gradient(180deg, var(--accent), var(--accent-2)); }

      margin-bottom: 0.35rem;

    .summary-stat .value {
      font-size: 1.1rem;

    .summary-total {

    .summary-total .amount {

    .btn-book {

      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;

      transition: all 0.3s var(--ease);
      box-shadow: 0 12px 28px -10px var(--accent-glow);
      white-space: nowrap;
    }

      box-shadow: 0 20px 40px -12px var(--accent-glow);
